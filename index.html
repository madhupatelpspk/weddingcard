<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Invitation</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }body {
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Poppins', sans-serif;
  padding: 20px;
}

.card {
  width: 420px;
  background: linear-gradient(180deg, #3b0000, #5c0000, #2b0000);
  border: 3px solid #c89b3c;
  border-radius: 24px;
  padding: 30px 25px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 15px 40px rgba(0,0,0,0.6);
  color: #fff;
}

.card::before,
.card::after {
  content: "";
  position: absolute;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: rgba(255, 0, 0, 0.15);
  filter: blur(40px);
  z-index: 0;
}

.card::before {
  top: -80px;
  left: -80px;
}

.card::after {
  bottom: -80px;
  right: -80px;
}

.content {
  position: relative;
  z-index: 2;
  text-align: center;
}

.top-text {
  font-size: 13px;
  letter-spacing: 3px;
  color: #f4d58d;
  margin-bottom: 12px;
  text-transform: uppercase;
}

.title {
  font-family: 'Cinzel', serif;
  font-size: 20px;
  color: #fff3d1;
  margin-bottom: 15px;
  line-height: 1.5;
}

.names {
  font-family: 'Great Vibes', cursive;
  font-size: 64px;
  color: #ffd36b;
  line-height: 1.1;
  text-shadow: 0 0 12px rgba(255, 215, 100, 0.4);
}

.and {
  font-size: 24px;
  color: #f8d37a;
  margin: 10px 0;
  font-family: 'Great Vibes', cursive;
}

.couple-img {
  width: 280px;
  height: 280px;
  border-radius: 50%;
  margin: 28px auto;
  border: 3px solid rgba(255,255,255,0.25);
  object-fit: cover;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

.details {
  margin-top: 15px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.detail-box {
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  padding: 15px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(6px);
}

.detail-label {
  font-size: 12px;
  color: #f4d58d;
  letter-spacing: 2px;
  margin-bottom: 5px;
  text-transform: uppercase;
}

.detail-value {
  font-size: 24px;
  font-family: 'Cinzel', serif;
  color: #ffffff;
  font-weight: 600;
}

.footer-text {
  margin-top: 28px;
  font-size: 14px;
  line-height: 1.8;
  color: #f1e6d0;
}

.footer-note {
  margin-top: 18px;
  font-family: 'Great Vibes', cursive;
  font-size: 30px;
  color: #ffd36b;
}

.flower {
  position: absolute;
  font-size: 42px;
  opacity: 0.15;
}

.flower.top-left {
  top: 15px;
  left: 15px;
}

.flower.bottom-right {
  bottom: 15px;
  right: 15px;
}

@media (max-width: 500px) {
  .card {
    width: 100%;
  }

  .names {
    font-size: 52px;
  }

  .couple-img {
    width: 240px;
    height: 240px;
  }
}

  </style>
</head>
<body>
  <div class="card">
    <div class="flower top-left">🌹</div>
    <div class="flower bottom-right">🌺</div><div class="content">
  <div class="top-text">You Are Cordially Invited To</div>

  <div class="title">Weeding Invitation</div>

  <div class="names">Thanasri</div>
  <div class="and">and</div>
  <div class="names">Madhukar</div>

  <img class="couple-img" src="https://raw.githubusercontent.com/madhupatelpspk/weddingcard/refs/heads/main/img/IMG_20260518_181636.png" alt="Couple Photo">

  <div class="details">
    <div class="detail-box">
      <div class="detail-label">Date</div>
      <div class="detail-value">May 27, 2026</div>
    </div>

    <div class="detail-box">
      <div class="detail-label">Time</div>
      <div class="detail-value">10:00 AM</div>
    </div>

    <div class="detail-box">
      <div class="detail-label">Venue</div>
      <div class="detail-value">Hajipur</div>
    </div>
  </div>

  <div class="footer-text">
    We invite you to share in our joy and celebrate our union.
  </div>

  <div class="footer-note">
    We look forward to celebrating with you!
  </div>
</div>

  </div>
</body>
</html>
